name: Monad-02 Prodigy Invariant Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write

jobs:
  run-monad02-prodigy:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn bằng Linux Shell gốc (Thoát ly Node.js)
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # VẬN HÀNH ĐỘNG CƠ MONAD-02 VƯỢT TỔ (TAM GIÁC ĐỒNG THUẬN 2/3)
      - name: Vận hành Hạt Nhân Monad-02
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python engine.py

      # LƯU TRẠNG THÁI VÀO GIT (CÓ TOKEN BẢO MẬT CHỐNG LỖI 128 & FAST-FORWARD)
      - name: Lưu vết tích đồng thuận tam giác
        run: |
          git config --global user.name "Monad-02-Prodigy-Bot"
          git config --global user.email "prodigy@monad02.node"
          
          # CẤP TOKEN ĐỂ ĐƯỢC PHÉP PUSH (MIỄN NHIỄM LỖI 128)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_backward.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "💎 [Monad-02 Vượt Tổ] Đồng thuận tam giác & Khắc cốt tri thức #(1+N) [skip ci]"
            git push origin main
          else
            echo "Môi trường tĩnh, không có biến đổi mới."
          fi
